user  nginx;
worker_processes auto;

# Optional: raise file descriptor limit if you expect many concurrent connections
# worker_rlimit_nofile 100000;

events {
    # Higher connections per worker for high traffic environments
    worker_connections 4096;

    # Optional: accept multiple new connections at once
    # multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------
    # Logging (recommended)
    # ------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;

    # ------------------------------------------------------------
    # Basic Security Hardening
    # ------------------------------------------------------------
    server_tokens off;

    # Always add security headers (even on 4xx/5xx responses)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Additional recommended headers
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # NOTE: HSTS should only be enabled when HTTPS is fully working
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------
    # Timeouts to protect against slow clients (basic DoS hardening)
    # ------------------------------------------------------------
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;

    # ------------------------------------------------------------
    # Gzip Compression
    # ------------------------------------------------------------
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024; # More reasonable default

    gzip_types
        text/plain
        text/css
        text/html
        application/json
        application/javascript
        application/xml
        text/xml
        image/svg+xml
        application/rss+xml
        application/atom+xml;

    # ------------------------------------------------------------
    # Connection Optimization
    # ------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;  # Limit requests per keepalive connection

    client_max_body_size 50M;

    # ------------------------------------------------------------
    # Rate Limiting (DDoS / abuse protection)
    # ------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Optional: limit concurrent connections per IP (extra protection)
    # limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ------------------------------------------------------------
    # Proxy Cache Path (use carefully for public GET endpoints only)
    # ------------------------------------------------------------
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=my_cache:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    # ------------------------------------------------------------
    # WebSocket / Upgrade mapping
    # ------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------
    # Upstreams (cleaner & allows easy scaling later)
    # ------------------------------------------------------------
    upstream nuhoud_service {
        server host.docker.internal:3000 max_fails=3 fail_timeout=10s;
        server host.docker.internal:3001 max_fails=3 fail_timeout=10s;
        server host.docker.internal:3002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream nuhoudjob_service {
        server host.docker.internal:4000 max_fails=3 fail_timeout=10s;
        server host.docker.internal:4001 max_fails=3 fail_timeout=10s;
        server host.docker.internal:4002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream minio_api {
        server minio:9000;
        keepalive 32;
    }

    upstream minio_console {
        server minio:9001;
        keepalive 32;
    }

    # ------------------------------------------------------------
    # Server block
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # --------------------------------------------------------
        # Proxy defaults (apply to all locations unless overridden)
        # --------------------------------------------------------
        proxy_http_version 1.1;

        # Correct WebSocket handling (do not force upgrade for all traffic)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve original host and client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Improve proxy performance
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;

        # Timeouts for upstream services
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # --------------------------------------------------------
        # Service 1 (Port 3000)
        # --------------------------------------------------------
        location /Nuhoud/ {
            limit_req zone=api_limit burst=20 nodelay;

            # Optional: limit concurrent connections per IP
            # limit_conn conn_limit 50;

            proxy_pass http://nuhoud_service/;

            # Example cache for public GET endpoints only (disabled by default)
            # proxy_cache my_cache;
            # proxy_cache_methods GET HEAD;
            # proxy_cache_valid 200 10m;
            # proxy_cache_bypass $http_authorization $http_cookie;
            # proxy_no_cache     $http_authorization $http_cookie;
            # add_header X-Cache-Status $upstream_cache_status always;
        }

        # --------------------------------------------------------
        # Service 2 (Port 4000)
        # --------------------------------------------------------
        location /NuhoudJob/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://nuhoudjob_service/;
        }

        # --------------------------------------------------------
        # MinIO S3 API
        # --------------------------------------------------------
        location /minio/ {
            proxy_pass http://minio_api/;
        }

        # --------------------------------------------------------
        # MinIO Console (uses WebSockets)
        # --------------------------------------------------------
        location /minio-console/ {
            proxy_pass http://minio_console/;
        }

        # --------------------------------------------------------
        # Health Check
        # --------------------------------------------------------
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }

    # ------------------------------------------------------------
    # HTTPS template (production-ready; enable when you have SSL)
    # ------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name example.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Same locations as above...
    # }
}
