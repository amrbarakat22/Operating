user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================================
    # 1. Security & Basic Hardening
    # ==========================================
    server_tokens off; # يخفي إصدار Nginx لمنع استغلال الثغرات المعروفة للإصدار

    # رؤوس أمان إضافية (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # ==========================================
    # 2. Optimization (Gzip Compression)
    # ==========================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # مستوى الضغط (1-9)، 6 هو التوازن الأفضل
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256; # لا تضغط الملفات الصغيرة جداً
    # أنواع الملفات التي سيتم ضغطها
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ==========================================
    # 3. Connection & Timeouts
    # ==========================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 50M; # كما طلبت سابقاً

    # ==========================================
    # 4. Rate Limiting (حماية من DDoS)
    # ==========================================
    # تعريف منطقة لتخزين معدل الطلبات بناءً على IP
    # rate=10r/s يعني السماح بـ 10 طلبات في الثانية لكل IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ==========================================
    # 5. Caching Path (إعداد مسار الكاش)
    # ==========================================
    # ملاحظة: الكاش مفيد للمحتوى الثابت، ولكن يجب الحذر مع الـ APIs
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # ==========================================
    # WebSocket upgrade mapping
    # ==========================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }


    server {
        listen 80;
        server_name localhost;

        # إعدادات موحدة للـ Proxy لتجنب التكرار
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SERVICE 1 -> port 3000
        location /Nuhoud/ {
            # تطبيق Rate Limiting
            # burst=20: يسمح بتجاوز الحد قليلاً لفترة قصيرة (لطلبات الاندفاع)
            # nodelay: يعالج الطلبات فوراً دون وضعها في طابور انتظار
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://host.docker.internal:3000/;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Caching (اختياري - مفعل هنا فقط في حالة النجاح 200)
            # proxy_cache my_cache;
            # proxy_cache_valid 200 302 10m;
            # proxy_cache_valid 404      1m;
            # add_header X-Proxy-Cache $upstream_cache_status;
        }

        # SERVICE 2 -> port 4000
        location /NuhoudJob/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://host.docker.internal:4000/;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # MinIO S3 API
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO Console
        location /minio-console/ {
            proxy_pass http://minio:9001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSockets (Console uses WebSockets)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        
        # Health Check (Best Practice)
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

    }
}
