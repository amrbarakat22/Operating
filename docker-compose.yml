services:
  kafka:
    image: bitnami/kafka:3.7 # Using a specific stable version is good practice
    container_name: kafka
    ports:
      - "9092:9092"   # Port for external access from your host machine
      - "29092:29092" # Port for internal access within the Docker network
      - "9093:9093"   # KRaft controller port
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093

      # Listener configuration
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
    volumes:
      - ./kafka-data:/bitnami/kafka

  
    
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    ports:
      - "9200:9000"
    environment:
      # Connect Kafdrop to the internal listener of Kafka
      - KAFKA_BROKER_CONNECT=kafka:29092
    depends_on:
      - kafka

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      # Put these in a .env file in real setups (don't hardcode)
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
      # Optional but useful when behind nginx / reverse proxy
      MINIO_BROWSER_REDIRECT_URL: http://localhost/minio-console
      # Public-facing API endpoint used by console/browser
      MINIO_SERVER_URL: http://localhost:9000
    volumes:
      - ./minio-data:/data
    ports:
      - "9000:9000"  # S3 API (optional to expose; internal is enough)
      - "9001:9001"  # Console (optional to expose; internal is enough)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Auto-create buckets + set policies on startup
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/avatars;
      mc mb -p local/user-uploads;
      # Avatars often public (optional). If you want private, remove this line:
      mc anonymous set download local/avatars;
      echo 'MinIO buckets ready';
      "
    restart: "no"


